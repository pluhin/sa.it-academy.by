apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-monitoring-grafana
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client
  local:
    path: /vault/data # УКАЖИТЕ ваш реальный путь на узле, где смонтирован NFS / папка
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node1 # УКАЖИТЕ имя вашей ноды, где находится этот путь (kubectl get nodes)
---
