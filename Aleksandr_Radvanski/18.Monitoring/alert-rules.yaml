additionalPrometheusRulesMap:
  cpu-alert-rules:
    groups:
      - name: pod-cpu-alerts
        rules:
          - alert: PodCpuUsageHigh
            expr: sum(rate(container_cpu_usage_seconds_total{container!="", namespace="monitoring"}[1m])) by (pod) > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage on pod {{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} CPU usage is above threshold"
