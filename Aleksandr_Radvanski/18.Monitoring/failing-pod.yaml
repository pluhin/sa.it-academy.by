apiVersion: v1
kind: Pod
metadata:
  name: failing-app
  namespace: monitoring
spec:
  restartPolicy: Always
  containers:
    - name: crasher
      image: alpine
      # Добавляем sleep 10, чтобы контейнер успел оставить след в истории containerd
      command: ["sh", "-c", "echo \"[FATAL] Critical database connection error at $(date)\"; sleep 10; exit 1"]
