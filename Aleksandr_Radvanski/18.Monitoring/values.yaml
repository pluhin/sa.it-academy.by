prometheus:
  enabled: true
  prometheusSpec:
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "nfs-client"
          volumeName: "pv-monitoring-prometheus"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

  additionalPrometheusRulesMap:
    cpu-alert-rules:
      groups:
        - name: pod-cpu-alerts
          rules:
            - alert: PodCpuUsageHigh
              expr: sum(rate(container_cpu_usage_seconds_total{container!="", namespace="monitoring"}[1m])) by (pod) > 0.05
              for: 2m
              labels:
                severity: warning
              annotations:
                summary: "High CPU usage on pod {{ $labels.pod }}"
                description: "Pod {{ $labels.pod }} CPU usage is above threshold"

grafana:
  enabled: true
  persistence:
    enabled: true
    storageClassName: "nfs-client"
    volumeName: "pv-monitoring-grafana"
    accessModes: ["ReadWriteOnce"]
    size: 5Gi

kubeProxy:
  enabled: true

alertmanager:
  enabled: true
  alertmanagerSpec:
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ["alertname", "namespace", "pod"]
        group_wait: 10s
        group_interval: 10s
        repeat_interval: 1h
        receiver: "slack-notifications"
      receivers:
        - name: "slack-notifications"
          slack_configs:
            - channel: "#new-channel"
              api_url: "https://hooks.slack.com/services/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"
              send_resolved: true
              title: "[{{ .Status | toUpper }}] Monitoring"
              text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"
