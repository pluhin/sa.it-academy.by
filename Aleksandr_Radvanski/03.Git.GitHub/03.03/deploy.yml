name: Deploy to GitHub

# Начало работы только при пуше в ветку  main
on:
  push:
    branches:
      - main

# Права на чтение/запись на GitHub
permissions:
  contents: read
  pages: write
  id-token: write

#Разрешить только одну сборку за раз
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      #Копируем файлы в робота
      - name: Checkout code
        uses: actions/checkout@v4

        #Настройка GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

        #Загрузка файлов сайта в архив
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

        #Публикация архива на сервере GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4