apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    path: argo-apps/ # Указываем строго на папку с управляющими манифестами
    repoURL: https://github.com/aionfiend/16.-Kubernetes.CICD.git
    targetRevision: main # Использована ветка main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
