version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-python-app:latest
    container_name: python-app
    ports:
      - "8000:8000"
    environment:
      - ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
