name: KinD Cluster Setup

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  kind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Install KinD
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create KinD cluster
        run: |
          kind create cluster --name kind-ci --config kind-config.yaml

      - name: Wait for cluster ready
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=120s

      - name: Get cluster info
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide
          kubectl get pods -A

      - name: Verify cluster is working
        run: |
          NODE_STATUS=$(kubectl get nodes -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}')
          if [ "$NODE_STATUS" != "True" ]; then
            echo "Cluster not ready"
            exit 1
          fi
          echo "Cluster is ready and working!"
