---
- name: Install and configure nginx
  hosts: nginx
  become: yes
  vars:
    nginx_hosts:
      host5:
        name: "site1.conf"
        server_name: "site1.example.com"
        port: 8081
        root: "/var/www/site1"
      host6:
        name: "site2.conf"
        server_name: "site2.example.com"
        port: 8082
        root: "/var/www/site2"
  tasks:
    - name: Select site config for this host
      set_fact:
        my_site: "{{ nginx_hosts[inventory_hostname] }}"

    - name: Ensure nginx is installed
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Create root directory for site
      file:
        path: "{{ my_site.root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Deploy index.html with unique content per host
      template:
        src: templates/index.html.j2
        dest: "{{ my_site.root }}/index.html"
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Deploy nginx virtual host config
      template:
        src: templates/nginx.conf.j2
        dest: "/etc/nginx/sites-available/{{ my_site.name }}"
        owner: root
        group: root
        mode: '0644'

    - name: Enable virtual host
      file:
        src: "/etc/nginx/sites-available/{{ my_site.name }}"
        dest: "/etc/nginx/sites-enabled/{{ my_site.name }}"
        state: link

    - name: Show last 20 lines of nginx journal
      command: journalctl -xeu nginx.service -n 20 --no-pager
      register: nginx_journal
      ignore_errors: yes

    - name: Print nginx journal
      debug:
        var: nginx_journal.stdout_lines

    - name: Ensure nginx is started and enabled
      service:
        name: nginx
        state: restarted
        enabled: yes

    - name: Verify website is accessible
      uri:
        url: "http://localhost:{{ my_site.port }}/"
        status_code: 200
        timeout: 10