apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ssh-keys-secret # Имя должно совпадать с secretName в Deployment
  namespace: default    # Укажи свой namespace, если используешь не default
spec:
  encryptedData:
    id_rsa: 
    id_rsa.pub: 

  template:
    metadata:
      labels:
        app: nginx
    type: Opaque
