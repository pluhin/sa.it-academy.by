apiVersion: v1
kind: Secret
metadata:
  name: app-sa-token
  namespace: app-zone
  annotations:
    kubernetes.io/service-account.name: "app-sa"
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Namespace
metadata:
  name: app-zone
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: app-zone
---
# Связь с сервером Vault
apiVersion:  secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault-connection
  namespace: app-zone
spec:
  address: http://vault.vault.svc.cluster.local:8200
  skipTLSVerify: true
---
# Описание метода аутентификации (используем созданный SA и метод k8s)
apiVersion:  secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
  namespace: app-zone
spec:
  vaultConnectionRef: vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-role
    serviceAccount: app-sa
---
# Сам синхронизируемый секрет
apiVersion:  secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: app-vault-secret
  namespace: app-zone
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: app-config
  refreshAfter: 10s # Для демонстрации авторотации ставим маленький интервал
  destination:
    name: k8s-native-secret
    create: true
    type: Opaque