stages:
  - build
  - test
  - report

# Правила для всего пайплайна (запуск при пушах в ветки и Merge Request)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build_job:
  stage: build
  image: alpine:latest
  script:
    - chmod +x hello.sh
    - sh hello.sh

check_websites_job:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    # Проверяем доступность 3 сайтов. Если сайт недоступен (код не 200), пишем его в report.txt
    - touch report.txt
    - curl -s -o /dev/null -w "%{http_code}" https://google.com | grep -q "200" || echo "google.com is unreachable" >> report.txt
    - curl -s -o /dev/null -w "%{http_code}" https://gitlab.com | grep -q "200" || echo "gitlab.com is unreachable" >> report.txt
    - curl -s -o /dev/null -w "%{http_code}" https://this-website-does-not-exist-123.com | grep -q "200" || echo "fake-website.com is unreachable" >> report.txt
    - echo "Проверка завершена. Содержимое отчета:"
    - cat report.txt
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - report.txt

# Другая задача в стадии test, чтобы проверить работу ключевого слова 'needs'
another_test_job:
  stage: test
  image: alpine:latest
  script:
    - sleep 30
    - echo "Я долгая задача, которая обычно задерживает стадию"

read_report_job:
  stage: report
  image: alpine:latest
  # Ключевое слово 'needs' позволяет этой задаче запуститься сразу, как только завершится 'check_websites_job',
  # не дожидаясь окончания долгой 'another_test_job'
  needs:
    - job: check_websites_job
      artifacts: true
  script:
    - echo "Чтение полученного артефакта:"
    - cat report.txt