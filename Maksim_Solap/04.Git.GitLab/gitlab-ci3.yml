stages:
  - build
  - test
  - report
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

build_job:
  stage: build
  image: alpine:latest
  script:
    - chmod +x hello.sh
    - sh hello.sh

check_websites_job:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - touch report.txt
    # Обернули строки в одинарные кавычки, чтобы GitLab CI не ругался на синтаксис bash
    - 'curl -s -o /dev/null -w "%{http_code}" https://google.com | grep -q "200" || echo "google.com is unreachable" >> report.txt'
    - 'curl -s -o /dev/null -w "%{http_code}" https://this-website-does-not-exist-123.com | grep -q "200" || echo "fake-website.com is unreachable" >> report.txt'
    - "true"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - report.txt

read_report_job:
  stage: report
  needs:
    - job: check_websites_job
      artifacts: true
  image: alpine:latest
  script:
    - cat report.txt

# Задача сборки и отправки Docker-образа через Buildah
# Задача сборки и отправки Docker-образа через Buildah
build_docker_image:
  stage: deploy
  image: quay.io/buildah/stable:v1.35.0
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    # Оставляем chroot на всякий случай для стабильности слоев внутри Docker
    BUILDAH_ISOLATION: chroot
    BUILDAH_LAYERS: "false"
  before_script:
    # Вместо $CI_REGISTRY жестко указываем адрес вашего поднятого реестра на порту 5050
    - echo "$CI_REGISTRY_PASSWORD" | buildah login --tls-verify=false -u "$CI_REGISTRY_USER" --password-stdin 172.20.10.10:5050
  script:
    # Собираем образ и тегируем его под ваш локальный реестр
    - buildah bud --format=docker -t "172.20.10.10:5050/${CI_PROJECT_PATH}:${CI_COMMIT_SHORT_SHA}" -t "172.20.10.10:5050/${CI_PROJECT_PATH}:latest" .
    # Пушим собранные теги в ваш локальный реестр
    - buildah push --tls-verify=false "172.20.10.10:5050/${CI_PROJECT_PATH}:${CI_COMMIT_SHORT_SHA}"
    - buildah push --tls-verify=false "172.20.10.10:5050/${CI_PROJECT_PATH}:latest"
