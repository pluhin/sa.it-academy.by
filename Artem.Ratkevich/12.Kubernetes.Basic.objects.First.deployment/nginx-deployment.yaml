---
apiVersion: v1
kind: Namespace
metadata:
  name: nginx-test

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-test
  namespace: nginx-test
  labels:
    app: nginx-test
spec:
  selector:
    app: nginx-test
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  namespace: nginx-test
  labels:
    app: nginx-test
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # can start 1 extra pod during update
      maxUnavailable: 0  # never drop below 4 available pods
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:            # pod gets traffic only when ready
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:                 # let Istio drain connections before shutdown
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx-test-pdb
  namespace: nginx-test
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: nginx-test

---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: nginx-test-gateway
  namespace: nginx-test
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "nginx-test.k8s-3.sa"

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: nginx-test
  namespace: nginx-test
spec:
  hosts:
    - "nginx-test.k8s-3.sa"
  gateways:
    - nginx-test-gateway
  http:
    - route:
        - destination:
            host: nginx-test        # the Service above
            port:
              number: 80
