{{- if and .Values.persistence.enabled .Values.persistence.pv.create }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.persistence.pv.name }}
  labels:
    app: {{ .Values.fullnameOverride }}
spec:
  capacity:
    storage: {{ .Values.persistence.pv.capacity }}
  accessModes:
{{- toYaml .Values.persistence.pv.accessModes | nindent 4 }}
  persistentVolumeReclaimPolicy: {{ .Values.persistence.pv.reclaimPolicy }}
  storageClassName: {{ .Values.persistence.pv.storageClassName | quote }}
  claimRef:
    namespace: {{ .Values.global.namespace }}
    name: {{ .Values.persistence.pvc.name }}
  nfs:
    server: {{ .Values.persistence.pv.nfs.server }}
    path: {{ .Values.persistence.pv.nfs.path }}
{{- end }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistence.pvc.name }}
  namespace: {{ .Values.global.namespace }}
spec:
  accessModes:
{{- toYaml .Values.persistence.pvc.accessModes | nindent 4 }}
  storageClassName: {{ .Values.persistence.pvc.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.pvc.capacity }}
{{- end }}
