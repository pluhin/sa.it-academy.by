- name: Hello Ansible
  hosts: localhost
  connection: local
  gather_facts: false
  
  tasks:
    - name: Print Hello Ansible message
      ansible.builtin.debug:
        msg: "Hello, Ansible!"
        
    - name: Print system info
      ansible.builtin.debug:
        msg: "Running on {{ ansible_os_family if ansible_os_family is defined else 'localhost' }}"