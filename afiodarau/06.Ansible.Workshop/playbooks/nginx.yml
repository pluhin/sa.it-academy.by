- name: Install and configure Nginx with virtual hosts
  hosts: servers
  become: yes
  vars_files:
    - ../vars/vhosts.yml

  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Create web root directories
      file:
        path: "{{ item.root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
      loop: "{{ nginx_vhosts }}"

    - name: Deploy HTML template
      template:
        src: index.html.j2
        dest: "{{ item.root }}/index.html"
      loop: "{{ nginx_vhosts }}"

    - name: Create Nginx vhost configs
      template:
        src: nginx_vhost.conf.j2
        dest: "/etc/nginx/sites-available/{{ item.server_name }}"
      loop: "{{ nginx_vhosts }}"

    - name: Enable vhosts
      file:
        src: "/etc/nginx/sites-available/{{ item.server_name }}"
        dest: "/etc/nginx/sites-enabled/{{ item.server_name }}"
        state: link
        force: yes
      loop: "{{ nginx_vhosts }}"

    - name: Test nginx configuration
      command: nginx -t
      changed_when: false

    - name: Restart nginx
      service:
        name: nginx
        state: restarted
        enabled: yes

    - name: Verify site1 virtual host
      uri:
        url: http://127.0.0.1
        headers:
          Host: "{{ nginx_vhosts[0].server_name }}"
        return_content: yes
        status_code: 200

    - name: Verify site2 virtual host
      uri:
        url: http://127.0.0.1
        headers:
          Host: "{{ nginx_vhosts[1].server_name }}"
        return_content: yes
        status_code: 200