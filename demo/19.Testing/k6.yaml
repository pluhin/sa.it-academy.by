---
apiVersion: v1
kind: Namespace
metadata:
  name: testing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
  namespace: testing
data:
  script.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    import { Trend, Rate } from 'k6/metrics';

    const latency = new Trend('grafana_health_ms');
    const failures = new Rate('failed_requests');

    export const options = {
      stages: [
        { duration: '20s', target: 10 },
        { duration: '40s', target: 10 },
        { duration: '10s', target: 0 },
      ],
      thresholds: {
        http_req_duration: ['p(95)<500'],
        failed_requests: ['rate<0.01'],
        grafana_health_ms: ['avg<200'],
      },
    };

    export default function () {
      const res = http.get('http://kps-grafana.monitoring.svc.cluster.local/api/health');
      const ok = check(res, {
        'status is 200': (r) => r.status === 200,
        'body has database': (r) => r.body.includes('database'),
      });
      failures.add(!ok);
      latency.add(res.timings.duration);
      sleep(1);
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: k6-load-test
  namespace: testing
spec:
  restartPolicy: Never
  containers:
    - name: k6
      image: grafana/k6:0.54.0
      command: ["k6", "run", "/scripts/script.js"]
      volumeMounts:
        - name: script
          mountPath: /scripts
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  volumes:
    - name: script
      configMap:
        name: k6-script
