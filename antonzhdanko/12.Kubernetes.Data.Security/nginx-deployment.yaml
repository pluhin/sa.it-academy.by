apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: homework-12
  labels:
    app: nginx
spec:
  replicas: 4
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      terminationGracePeriodSeconds: 45
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: nginx
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: generate-index
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              printf '<!doctype html>\n<html><body><h1>Pod hostname: %s</h1></body></html>\n' \
                "$(hostname)" > /work/index.html
          resources:
            requests:
              cpu: 5m
              memory: 4Mi
            limits:
              cpu: 25m
              memory: 16Mi
          volumeMounts:
            - name: web-content
              mountPath: /work
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: root-ssh-keys
              mountPath: /root/.ssh
              readOnly: true
      volumes:
        - name: web-content
          emptyDir: {}
        - name: root-ssh-keys
          secret:
            secretName: root-ssh-keys
            items:
              - key: id_ed25519
                path: id_ed25519
                mode: 0400
              - key: id_ed25519.pub
                path: id_ed25519.pub
                mode: 0444
