apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: homework-17
  labels:
    app: log-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
        - name: logger
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              counter=1
              while true; do
                echo "$(date -Iseconds) level=INFO pod=${HOSTNAME} counter=${counter} message=homework-log-entry"
                counter=$((counter + 1))
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi

