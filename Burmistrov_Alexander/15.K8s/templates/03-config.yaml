---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  admin-password: "{{ .Values.secrets.adminPassword }}"
  github-token: "{{ .Values.secrets.githubToken }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-config
  namespace: {{ .Release.Namespace }}
data:
  jenkins.yaml: |
    jenkins:
      numExecutors: 2
      clouds:
        - kubernetes:
            containerCapStr: "10"
            maxRequestsPerHostStr: "32"
            jenkinsUrl: "http://jenkins.{{ .Release.Namespace }}.svc.cluster.local:8080"
            name: "kubernetes"
            namespace: "{{ .Release.Namespace }}"
            skipTlsVerify: true
    credentials:
      system:
        domainCredentials:
          - credentials:
              - usernamePassword:
                  description: "GitHub user"
                  id: "github-creds"
                  scope: GLOBAL
                  username: "CHANGE_ME"
                  password: "${GITHUB_TOKEN}"
    unclassified:
      location:
        adminAddress: "CHANGE_ME@example.com"
        url: "{{ .Values.location.url }}"
      shell:
        shell: "/bin/bash"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: basic-security
  namespace: {{ .Release.Namespace }}
data:
  basic-security.groovy: |
    #!groovy
    import jenkins.model.*
    import hudson.security.*
    def instance = Jenkins.getInstance()
    println "--> creating local user 'admin'"
    def password = System.getenv("ADMIN_PASSWORD")
    def hudsonRealm = new HudsonPrivateSecurityRealm(false)
    hudsonRealm.createAccount('admin', password)
    instance.setSecurityRealm(hudsonRealm)
    def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
    strategy.setAllowAnonymousRead(false)
    instance.setAuthorizationStrategy(strategy)
    instance.save()
