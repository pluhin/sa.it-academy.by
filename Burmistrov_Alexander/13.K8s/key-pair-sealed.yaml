apiVersion: v1
kind: Namespace
metadata:
  name: 13-k8s
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: key-pair
  namespace: 13-k8s
spec:
  encryptedData:
    id_rsa: 
    id_rsa.pub: 
  template:
    metadata:
      name: key-pair
      namespace: 13-k8s
    type: Opaque
---
apiVersion: v1
kind: Pod
metadata:
  name: secret
  namespace: 13-k8s
spec:
  restartPolicy: Never
  containers:
  - name: secret
    image: busybox:1.36
    command: ["/bin/sh", "-c", "sleep 36000"]
    volumeMounts:
      - name: keys
        mountPath: /cred
        readOnly: true
  volumes:
    - name: keys
      secret:
        secretName: key-pair