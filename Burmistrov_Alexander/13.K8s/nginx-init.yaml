apiVersion: v1
kind: Namespace
metadata:
  name: 13-k8s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: 13-k8s
spec:
  replicas: 3
  selector:
    matchLabels:
      app: html-nginx
  template:
    metadata:
      labels:
        app: html-nginx
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: prepare-html
          image: busybox:1.36
          command:
            - /bin/sh
            - -ec
            - |
              cat > /website/index.html << EOF
              <!doctype html>
              <html lang="ru">
              <head>
                <meta charset="utf-8">
                <title>Kubernetes lab</title>
              </head>
              <body>
                <h1>Hello from nginx</h1>
                <p>This HTML is hosted in pod $(hostname)</p>
              </body>
              </html>
              EOF
          volumeMounts:
            - name: website
              mountPath: /website
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: website
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: website
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: 13-k8s
spec:
  selector:
    app: html-nginx
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: hostame-check
  namespace: 13-k8s
spec:
  restartPolicy: Never
  containers:
  - name: hostname-echo
    image: quay.io/curl/curl:latest
    command: ["/bin/sh", "-c", "sleep 36000"]
