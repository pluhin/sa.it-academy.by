apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: linkding-server
  namespace: linkding
spec:
  parentRefs:
    - name: main-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - linkding.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: linkding
          port: 80